<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#0F121E"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>

    <!-- Neon Cyber Border Gradient -->
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00FF9D"/>
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Capsule -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="url(#cyberNeon)" stroke-width="20" />

  <!-- Inner Sub-pixel Circuit Matrix -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="8, 12" opacity="0.35"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00FF9D" stroke-width="2" stroke-dasharray="16, 8" opacity="0.25"/>

  <!-- Stylized Cyber 'M' / Terminal Glyph -->
  <path d="M 144 340 L 144 172 L 256 284 L 368 172 L 368 340" 
        fill="none" 
        stroke="url(#cyberNeon)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Live Kernel Beacon Dots -->
  <circle cx="256" cy="284" r="10" fill="#00FF9D" filter="url(#glow)"/>
  <circle cx="144" cy="172" r="8" fill="#00F0FF"/>
  <circle cx="368" cy="172" r="8" fill="#00FF9D"/>
</svg>
